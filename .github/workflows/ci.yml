name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      RUN_MUTATING_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      # Node 21+ kreves: node --test med glob-mønster ("test/**/*.test.js")
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Initialiser skjema i test-DB
        run: node scripts/init-test-db.js
      - run: npm test
